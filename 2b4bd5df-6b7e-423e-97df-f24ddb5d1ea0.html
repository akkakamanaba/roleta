<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Roleta Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #3b0764, #0b0014);
  color: #fff;
  font-family: 'Arial', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  margin-bottom: 10px;
  color: #e879f9;
  text-shadow: 0 0 12px #a855f7;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.roleta-container {
  position: relative;
  width: 320px;
  height: 320px;
}

canvas {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 6px solid #a855f7;
  box-shadow: 0 0 30px #a855f7;
  transition: transform 4s cubic-bezier(0.1, 0.8, 0.2, 1);
  cursor: pointer;
}

.seta {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 34px;
}

.info {
  margin-top: 20px;
  padding: 12px 22px;
  border-radius: 14px;
  background: rgba(168,85,247,0.15);
  border: 1px solid #a855f7;
  box-shadow: 0 0 15px rgba(168,85,247,0.6);
  min-width: 220px;
}

.info span {
  color: #e879f9;
  font-weight: bold;
}

@media (max-width: 400px) {
  .roleta-container {
    width: 260px;
    height: 260px;
  }
}
</style>
</head>
<body>

<h1>🎡 Roleta Premium</h1>

<div class="container">
  <div class="roleta-container">
    <div class="seta">⬇️</div>
    <canvas id="roleta" width="320" height="320"></canvas>
  </div>

  <div class="info" id="resultado">
    Toque na roleta para girar
  </div>
</div>

<script>
const premios = [
  { nome: "500K", chance: 50 },
  { nome: "1M", chance: 25 },
  { nome: "3M", chance: 15 },
  { nome: "5M", chance: 5 },
  { nome: "8M", chance: 1 },
  { nome: "12M", chance: 0 },
  { nome: "15M", chance: 0 },
  { nome: "25M", chance: 0 },
  { nome: "50M", chance: 0 }
];

const canvas = document.getElementById("roleta");
const ctx = canvas.getContext("2d");
const resultado = document.getElementById("resultado");
const total = premios.length;
const angulo = (2 * Math.PI) / total;
let rotacao = 0;
let girando = false;

function desenhar() {
  premios.forEach((p, i) => {
    ctx.beginPath();
    ctx.moveTo(160,160);
    ctx.fillStyle = `hsl(${270 + i * 10}, 80%, 55%)`;
    ctx.arc(160,160,160, i * angulo, (i + 1) * angulo);
    ctx.fill();

    ctx.save();
    ctx.translate(160,160);
    ctx.rotate(i * angulo + angulo / 2);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px Arial";
    ctx.fillText(p.nome, 90, 5);
    ctx.restore();
  });
}

desenhar();

function sortear() {
  const totalChance = premios.reduce((s, p) => s + p.chance, 0);
  let r = Math.random() * totalChance;
  let soma = 0;
  for (let i = 0; i < premios.length; i++) {
    soma += premios[i].chance;
    if (r <= soma) return i;
  }
  return 0;
}

canvas.addEventListener("click", () => {
  if (girando) return;
  girando = true;
  resultado.innerHTML = "Girando...";
  const i = sortear();
  rotacao += 360 * 6 + (360 / total) * i;
  canvas.style.transform = `rotate(${rotacao}deg)`;

  setTimeout(() => {
    resultado.innerHTML = `✨ Resultado: <span>${premios[i].nome}</span>`;
    girando = false;
  }, 4000);
});
</script>

</body>
</html>
