<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Roleta Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #3b0764, #0b0014);
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  color: #e879f9;
  text-shadow: 0 0 12px #a855f7;
}

.roleta-container {
  position: relative;
  width: 320px;
  height: 320px;
}

canvas {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 6px solid #a855f7;
  box-shadow: 0 0 30px #a855f7;
  transition: transform 4s cubic-bezier(0.1, 0.8, 0.2, 1);
  cursor: pointer;
}

.seta {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-bottom: 22px solid #ffffff;
  filter: drop-shadow(0 0 6px #a855f7);
  z-index: 10;
}

.info {
  margin-top: 20px;
  padding: 14px;
  border-radius: 14px;
  background: rgba(168,85,247,0.15);
  border: 1px solid #a855f7;
  box-shadow: 0 0 15px rgba(168,85,247,0.6);
  width: 320px;
}

.info h3 {
  margin-top: 0;
  text-align: center;
  color: #e879f9;
}

.info input {
  width: 100%;
  margin: 6px 0;
  padding: 8px;
  border-radius: 8px;
  border: none;
  outline: none;
}

.info button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #a855f7;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#lista {
  margin-top: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>🎡 Roleta Premium</h1>

<div class="roleta-container">
  <div class="seta"></div>
  <canvas id="roleta" width="320" height="320"></canvas>
</div>

<div class="info" id="resultado">
  Clique na roleta para girar
</div>

<div class="info">
  <h3>🧾 Registrar Jogador</h3>
  <input id="nome" placeholder="Digite seu nome">
  <button onclick="registrar()">Confirmar</button>
</div>

<div class="info">
  <h3>🏆 Quem ganhou</h3>
  <div id="lista"></div>
</div>

<script>
const premios = [
  { nome: "500K", chance: 50 },
  { nome: "1M", chance: 25 },
  { nome: "3M", chance: 15 },
  { nome: "5M", chance: 5 },
  { nome: "8M", chance: 1 },
  { nome: "12M", chance: 0 },
  { nome: "15M", chance: 0 },
  { nome: "25M", chance: 0 },
  { nome: "50M", chance: 0 }
];

const canvas = document.getElementById("roleta");
const ctx = canvas.getContext("2d");
const resultado = document.getElementById("resultado");

const total = premios.length;
const anguloPorPremio = 360 / total;
let girando = false;
let ultimoNome = "";

function desenhar() {
  premios.forEach((p, i) => {
    ctx.beginPath();
    ctx.moveTo(160, 160);
    ctx.fillStyle = `hsl(${270 + i * 12}, 80%, 55%)`;
    ctx.arc(
      160,
      160,
      160,
      (i * 2 * Math.PI) / total,
      ((i + 1) * 2 * Math.PI) / total
    );
    ctx.fill();

    ctx.save();
    ctx.translate(160, 160);
    ctx.rotate((i + 0.5) * (2 * Math.PI / total));
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px Arial";
    ctx.fillText(p.nome, 90, 5);
    ctx.restore();
  });
}
desenhar();

function sortear() {
  const soma = premios.reduce((s, p) => s + p.chance, 0);
  let r = Math.random() * soma;
  let acc = 0;
  for (let i = 0; i < premios.length; i++) {
    acc += premios[i].chance;
    if (r <= acc) return i;
  }
  return 0;
}

canvas.addEventListener("click", () => {
  if (girando) return;
  if (!ultimoNome) {
    alert("Digite seu nome antes de girar!");
    return;
  }

  girando = true;
  resultado.innerHTML = "Girando...";

  const i = sortear();
  const voltasExtras = 6;

  const rotacao =
    (voltasExtras * 360) +
    (270 - (i * anguloPorPremio)) -
    (anguloPorPremio / 2);

  canvas.style.transform = `rotate(${rotacao}deg)`;

  setTimeout(() => {
    resultado.innerHTML = `✨ ${ultimoNome} ganhou <b>${premios[i].nome}</b>`;
    document.getElementById("lista").innerHTML +=
      `<div>🎉 <b>${ultimoNome}</b> → ${premios[i].nome}</div>`;
    ultimoNome = "";
    document.getElementById("nome").value = "";
    girando = false;
  }, 4000);
});

function registrar() {
  const nome = document.getElementById("nome").value.trim();
  if (!nome) {
    alert("Digite um nome!");
    return;
  }
  ultimoNome = nome;
  resultado.innerHTML = "Agora gire a roleta 🎡";
}
</script>

</body>
</html>
