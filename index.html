<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Death Store - Caixa da Sorte</title>
<style>
  body {
    background: radial-gradient(circle at top, #2a003d, #0b0014);
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    text-align: center;
  }

  h1 {
    font-size: 36px;
    color: #b84cff;
    text-shadow: 0 0 15px #7a00ff;
  }

  input {
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    text-align: center;
    margin-top: 10px;
    width: 280px;
  }

  button {
    margin-top: 12px;
    background: linear-gradient(135deg, #7a00ff, #b84cff);
    border: none;
    padding: 14px 32px;
    font-size: 18px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
  }

  #resultado {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
    color: #e6ccff;
  }
</style>
</head>
<body>

<h1>☠️ Death Store ☠️</h1>
<p>Digite a key para abrir a caixa</p>

<input id="keyInput" placeholder="Digite sua key">
<br>
<button onclick="usarKey()">🎁 Abrir Caixa</button>

<div id="resultado"></div>

<script>
  // 🔒 KEY PRIVADA (só você sabe)
  const KEY_PRIVADA = "DEATH-STORE-PRIVATE-KEY";

  const premios = [
    { nome: "1.000.000 de gemas 💎", chance: 50 },
    { nome: "2.000.000 de gemas 💎", chance: 50 },
    { nome: "3.000.000 de gemas 💎", chance: 25 },
    { nome: "5.000.000 de gemas 💎", chance: 20 }
  ];

  function usarKey() {
    const keyDigitada = document.getElementById("keyInput").value.trim();

    if (keyDigitada !== KEY_PRIVADA) {
      document.getElementById("resultado").innerText =
        "❌ Key inválida.";
      return;
    }

    if (localStorage.getItem("deathstore_usou")) {
      document.getElementById("resultado").innerText =
        "❌ Você já abriu esta caixa.";
      return;
    }

    const total = premios.reduce((t, p) => t + p.chance, 0);
    let sorteio = Math.random() * total;

    for (let p of premios) {
      if (sorteio < p.chance) {
        document.getElementById("resultado").innerText =
          `🎉 Parabéns! Você ganhou ${p.nome}`;
        localStorage.setItem("deathstore_usou", "true");
        return;
      }
      sorteio -= p.chance;
    }
  }
</script>

</body>
</html>
